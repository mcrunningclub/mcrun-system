{
    "source": {
        "include": [ 
            "../mcrun-membership-list",
            "../mcrun-new-member-communications",
            "../mcrun-attendance",
            "../mcrun-attendance-master",
            "../points-system",
            "../mcrace-code"
        ],
        "includePattern": ".+\\.gs$"
    },
    "sourceType": "script",
    "plugins": ["./plugins/autoModule.js"],
    "opts": {
        "template": "templates/default",  // same as -t
        "encoding": "utf8",               // same as -e
        "destination": "./jsdoc_site/",          // same as -d
        "recurse": true,                  // same as -r
        "tutorials": "./jsdoc_tutorials" // same as -u
    }
}